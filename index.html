/* ══════════════════ 匯入地點清單 ══════════════════ */
/* KML（我的地圖）帶座標最準；CSV／純文字只有名稱地址，之後排隊用 Nominatim 補座標。 */
function parseKML(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.querySelector('parsererror'))throw new Error('KML 格式讀不懂');
  const dataOf=(pm,label)=>{
    for(const d of pm.getElementsByTagName('Data'))
      if(d.getAttribute('name')===label)
        return ((d.getElementsByTagName('value')[0]||{}).textContent||'').trim();
    return '';
  };
  return [...doc.getElementsByTagName('Placemark')].map(pm=>{
    const name=((pm.getElementsByTagName('name')[0]||{}).textContent||'').trim();
    const desc=(pm.getElementsByTagName('description')[0]||{}).textContent||'';
    /* 我的地圖若是從表格匯入、用「地名」定位，匯出的 KML 只有 <address>，沒有座標。
       這時候把 address 留著當搜尋關鍵字，之後交給 OSM 逐一定位。 */
    const addr=((pm.getElementsByTagName('address')[0]||{}).textContent||'').trim();
    const co=((pm.getElementsByTagName('coordinates')[0]||{}).textContent||'').trim();
    const nums=co?co.split(/\s+/)[0].split(',').map(Number):[];
    const ok=nums.length>=2&&isFinite(nums[0])&&isFinite(nums[1]);
    const lng=ok?nums[0]:null,lat=ok?nums[1]:null;
    /* ExtendedData 的欄位比 description 乾淨（description 會把空欄位也印出來） */
    const url=dataOf(pm,'網址')||dataOf(pm,'URL')||
      ((desc.match(/https?:\/\/[^\s<"]+/)||[])[0]||'');
    const note=[dataOf(pm,'筆記'),dataOf(pm,'留言'),dataOf(pm,'標籤')].filter(Boolean).join(' ・ ')||
      desc.replace(/<[^>]*>/g,' ').replace(/https?:\/\/\S+/g,' ')
          .replace(/(筆記|網址|標籤|留言)\s*:/g,' ').replace(/\s+/g,' ').trim();
    return{name,note:note.slice(0,140),url,lat,lng,
      address:(addr&&addr!==name)?addr:''};
  }).filter(x=>x.name||x.lat!=null);
}
function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'&&text[i+1]==='"'){cell+='"';i++} else if(ch==='"')q=false; else cell+=ch; }
    else if(ch==='"')q=true;
    else if(ch===','){row.push(cell);cell=''}
    else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}
    else if(ch!=='\r')cell+=ch;
  }
  if(cell||row.length){row.push(cell);rows.push(row)}
  if(!rows.length)return[];
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const col=n=>head.indexOf(n);
  const iT=col('title'),iN=col('note'),iU=col('url'),iA=col('address');
  if(iT<0)return rows.filter(r=>r[0]&&r[0].trim()).map(r=>({name:r[0].trim(),note:'',lat:null,lng:null,address:''}));
  return rows.slice(1).filter(r=>r[iT]&&r[iT].trim()).map(r=>({
    name:r[iT].trim(),note:iN>=0?(r[iN]||'').trim():'',url:iU>=0?(r[iU]||'').trim():'',
    address:iA>=0?(r[iA]||'').trim():'',lat:null,lng:null,
  }));
}
const parseLines=t=>t.split(/\n/).map(x=>x.trim()).filter(Boolean)
  .filter(x=>!/^https?:/i.test(x))
  .map(x=>({name:x,note:'',lat:null,lng:null,address:''}));

/* ── 重複判斷 ──
   只比名稱會出兩種錯：「淺草寺／浅草寺」被當成兩個；
   「一蘭拉麵」的澀谷店和新宿店被當成同一個。所以以座標為主、名稱為輔。 */
const normName=n=>jpNormalize(String(n||'')).toLowerCase().replace(/[\s・·,，、．.\-－]/g,'');
function sameSpot(a,b){
  const d=(a.lat!=null&&b.lat!=null)?km(a,b):null;
  if(d!=null&&d<0.12)return true;                  // 120 公尺內 → 同一個地方，名稱不同也算
  const na=normName(a.name),nb=normName(b.name);
  if(!na||na!==nb)return false;
  if(d==null)return true;                          // 沒座標可比，只能信名稱
  return d<2;                                      // 同名但相距 2km 以上 → 不同分店
}
/* 判斷重複時要連「已經排進行程表的」一起算，否則重新匯入會多出一份 */
const allSpots=()=>[
  ...S.pool,
  ...S.days.flatMap(d=>d.items),
  ...(S.lodgings||[]),
].map(x=>({name:x.name,lat:x.lat,lng:x.lng}));

/* ── 同一個地點被排到好幾天 ──
   候選池那筆是「本尊」，加到某天時複製一份分身，用 ref 指回本尊。
   本尊的 fam 是自己的 id，分身的 fam 是 ref，所以就算本尊被刪掉，
   分身之間仍然認得彼此、繼續連動。 */
const famOf=c=>c&&(c.ref||c.id);
const famMembers=fam=>[
  ...S.pool.filter(x=>famOf(x)===fam),
  ...S.days.flatMap(d=>d.items.filter(x=>famOf(x)===fam)),
];
const famDays=fam=>S.days.map((d,i)=>d.items.some(x=>famOf(x)===fam)?i:-1).filter(i=>i>=0);
/* 座標變了，那幾天的交通估算全部要重算（pk 清掉就會重估） */
const resetTrOfDays=idx=>idx.forEach(i=>{
  const d=S.days[i];if(!d)return;
  d.items.forEach(x=>{if(x.tr&&!x.tr.man)x.tr.pk=''});
  if(d.trIn&&!d.trIn.man)d.trIn.pk='';
  if(d.trOut&&!d.trOut.man)d.trOut.pk='';
});

let geoRun=false;
async function geocodePool(ids,onStep){
  if(geoRun)return;geoRun=true;
  let done=0,ok=0;
  for(const id of ids){
    if(!geoRun)break;
    const c=S.pool.find(x=>x.id===id);
    if(c&&c.lat==null){
      try{
        const r=await searchPlaces(c._addr||c.name,S.trip.area);
        if(r.list&&r.list.length){c.lat=r.list[0].lat;c.lng=r.list[0].lng;
          if(!c.url)c.url=`https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}`;ok++}
      }catch(e){}
    }
    done++;onStep&&onStep(done,ids.length,ok);
    save();renderPool();
  }
  geoRun=false;
  toast(`定位完成：${ok} / ${ids.length} 個成功`);
}

function importSheet(){
  openModal(`<h3>匯入地點清單</h3>
    <p class="hint">支援 Google「<b>我的地圖</b>」分享連結（會帶座標，最準）、KML 檔、
      Google Takeout 的清單 CSV，或每行一個地名／地址。<br>
      「已儲存清單」的分享連結<b>沒辦法</b>直接讀 —— Google 沒開放，要先轉成我的地圖。</p>
    ${S.trip.mapMid?`<button class="mbtn" id="im_again" style="margin-top:10px">↻ 從上次的「我的地圖」更新</button>`:''}
    <label class="f">貼上我的地圖連結，或每行一個地名／地址</label>
    <textarea id="im_txt" style="min-height:90px" placeholder="https://www.google.com/maps/d/edit?mid=...
或
淺草寺
teamLab Planets
東京都台東区浅草2-3-1"></textarea>
    <div class="imbar">
      <button class="mbtn" id="im_go" style="margin:0;flex:1">讀取</button>
      <button class="mbtn gh" id="im_pick" style="margin:0;flex:1">選擇檔案</button>
    </div>
    <input type="file" id="im_file" accept=".kml,.csv,.txt,.xml" style="display:none">
    <div id="im_res"></div>`);

  let items=[],fromMap=false;
  const show=(msg)=>{$('#im_res').innerHTML=`<div class="resmsg">${msg}</div>`};

  const preview=()=>{
    if(!items.length)return show('讀不到任何地點。');
    const known=allSpots();
    items.forEach(x=>{
      x.dup=known.some(k=>sameSpot(k,x));
      /* 同名但距離很遠 → 是不同分店，要讓使用者知道不是誤判 */
      x.far=!x.dup&&known.some(k=>normName(k.name)&&normName(k.name)===normName(x.name));
      if(x.dup&&x.sel!==false)x.sel=false;
    });
    const fresh=items.filter(x=>!x.dup).length;
    const have=items.filter(x=>x.lat!=null).length;
    const noGeo=(fromMap&&have===0&&items.length>2)
      ? `<div class="resmsg">ℹ️ 這張「我的地圖」是從表格匯入、用<b>地名</b>定位的，
           Google 匯出時只給地名不給座標。按下匯入後，App 會自動用 OpenStreetMap
           逐一查（每秒一筆，約 ${Math.ceil(items.length*1.2/60)} 分鐘），
           查不到的會標成「需定位」，之後手動補即可。</div>` : '';
    $('#im_res').innerHTML=noGeo+`
      <div class="imbar">共 ${items.length} 個 ・ ${fresh} 個是新的 ・ ${have} 個已有座標
        <button class="lnk" id="im_all" style="margin-left:auto">全選／全不選</button></div>
      <div class="imlist">${items.map((x,i)=>`
        <label class="imrow">
          <input type="checkbox" data-i="${i}" ${x.sel?'checked':''}>
          <div class="g"><b>${esc(x.name||'（無名稱）')}</b>
            <small>${esc(x.address||x.note||'')}</small></div>
          ${x.dup?'<span class="tagno">已存在</span>'
            :x.far?'<span class="tagok" style="color:var(--idle);background:#e8eefb">同名不同點</span>'
            :`<span class="${x.lat!=null?'tagok':'tagno'}">${x.lat!=null?'有座標':'需定位'}</span>`}
        </label>`).join('')}</div>
      <button class="mbtn" id="im_add">匯入到候選池</button>`;
    $('#im_res').querySelectorAll('[data-i]').forEach(cb=>cb.onchange=()=>{items[+cb.dataset.i].sel=cb.checked});
    $('#im_all').onclick=()=>{const on=!items.every(x=>x.sel);items.forEach(x=>x.sel=on);preview()};
    $('#im_add').onclick=doImport;
  };

  const loadMap=async(mid)=>{
    if(!syncBase())return show('要讀我的地圖連結，需要先在「👥 共同編輯」設定 Worker 網址。');
    show('讀取我的地圖中…');
    try{
      const base=syncBase();
      const api=`${base}/kml?mid=${encodeURIComponent(mid)}`;
      const r=await fetch(api);
      const body=await r.text();
      if(!r.ok){
        let msg='';try{msg=(JSON.parse(body)||{}).error||''}catch(_){}
        if(!msg)msg='伺服器回應 '+r.status+'（'+body.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,80)+'）';
        throw new Error(msg+'｜網址：'+api);
      }
      items=parseKML(body).map(x=>({...x,sel:true}));
      fromMap=true;S.trip.mapMid=mid;save();
      preview();
      /* 地圖上被刪掉、但候選池還留著的 */
      const gone=S.pool.filter(x=>x.src==='map'&&!items.some(i=>sameSpot(i,x)));
      if(gone.length){
        $('#im_res').insertAdjacentHTML('afterbegin',
          `<div class="resmsg">🗑 候選池有 <b>${gone.length}</b> 個地點已經不在這張地圖上
            （${gone.map(x=>esc(x.name)).join('、')}）
            <button class="lnk" id="im_gone">移除它們</button></div>`);
        $('#im_gone').onclick=()=>{
          snapshot('移除已從地圖刪除的地點');
          gone.forEach(g=>{const i=S.pool.indexOf(g);if(i>=0)S.pool.splice(i,1)});
          save();render();preview();toast(`已移除 ${gone.length} 個`,true);
        };
      }
    }catch(e){show('讀取失敗：'+esc(e.message)+'<br>確認地圖已設為「知道連結的人可查看」，且 Worker 是最新版。')}
  };
  const load=async()=>{
    const txt=$('#im_txt').value.trim();
    if(!txt)return show('請先貼上連結或地名。');
    const mid=(txt.match(/[?&]mid=([^&\s]+)/)||[])[1];
    if(mid)return loadMap(mid);
    fromMap=false;
    items=parseLines(txt).map(x=>({...x,sel:true}));
    preview();
  };
  $('#im_go').onclick=load;
  if(S.trip.mapMid)$('#im_again').onclick=()=>loadMap(S.trip.mapMid);
  $('#im_pick').onclick=()=>$('#im_file').click();
  $('#im_file').onchange=ev=>{
    const f=ev.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const t=String(rd.result);
        const isKml=/\.kml$|\.xml$/i.test(f.name)||t.trim().startsWith('<');
        fromMap=isKml;
        items=isKml?parseKML(t):/\.csv$/i.test(f.name)?parseCSV(t):parseLines(t);
        items=items.map(x=>({...x,sel:true}));preview();
      }catch(e){show('讀取失敗：'+esc(e.message))}
    };
    rd.readAsText(f);
  };

  function doImport(){
    const picked=items.filter(x=>x.sel&&x.name);
    if(!picked.length)return toast('沒有勾選任何地點');
    snapshot(`匯入 ${picked.length} 個地點`);
    const exist=allSpots();
    const added=[];
    picked.forEach(x=>{
      if(exist.some(k=>sameSpot(k,x)))return;
      const a={id:nid(),name:x.name,emoji:CAT.sight.e,cat:'sight',dur:60,cost:0,
        note:x.note||'',url:x.url||'',lat:x.lat??null,lng:x.lng??null,pin:null,tr:null,votes:[],
        src:fromMap?'map':undefined};
      if(x.address)a._addr=x.address;
      S.pool.push(a);added.push(a);exist.push({name:a.name,lat:a.lat,lng:a.lng});
    });
    const need=added.filter(a=>a.lat==null).map(a=>a.id);
    save();render();
    const skipped=picked.length-added.length;
    closeModal();
    toast(`已加入 ${added.length} 個${skipped?`（跳過 ${skipped} 個重複）`:''}`,true);
    if(need.length){
      openModal(`<h3>定位中</h3>
        <p class="hint">有 ${need.length} 個地點沒有座標，正在用 OpenStreetMap 逐一查詢。
          規定每秒只能查一筆，請稍等；你也可以關掉這個視窗，它會在背景繼續。</p>
        <div id="gp" style="font-size:13px;font-weight:600">0 / ${need.length}</div>
        <button class="mbtn gh" id="gstop">停止</button>`);
      $('#gstop').onclick=()=>{geoRun=false;closeModal()};
      geocodePool(need,(d,t,ok)=>{const el=$('#gp');if(el)el.textContent=`${d} / ${t}　（成功 ${ok}）`;
        if(d===t)closeModal();});
    }
  }
}

/* ══════════════════ 旅行當天模式 ══════════════════ */
/* 規劃時要看全貌，真的在路上時只想知道三件事：
   現在在哪、幾點要走、下一段怎麼去。 */
let todayTimer=null;
function todayIdx(){
  const t=iso(new Date());
  const i=daySpan(S.trip.startDate,t)-1;
  return (i>=0&&i<S.days.length)?i:day;      // 不在旅程期間就顯示目前這一天
}
const dirLink=(a,b,mode)=>{
  const m={walk:'walking',transit:'transit',drive:'driving',taxi:'driving',other:'transit'}[mode]||'transit';
  const o=(a&&a.lat!=null)?`&origin=${a.lat},${a.lng}`:'';
  return `https://www.google.com/maps/dir/?api=1${o}&destination=${b.lat},${b.lng}&travelmode=${m}`;
};
function renderToday(){
  const el=$('#today');
  const idx=todayIdx(),d=S.days[idx];
  compute(d,idx);
  const now=new Date(),nm=now.getHours()*60+now.getMinutes();
  const hh=String(now.getHours()).padStart(2,'0'),mm=String(now.getMinutes()).padStart(2,'0');
  const isToday=iso(new Date())===iso(dateOf(idx));

  let h=`<div class="thead">
    <div style="flex:1">
      <h2>Day ${idx+1}　${dLabel(idx)}（${wLabel(idx)}）${isToday?'':' ・ 非今天'}</h2>
      <div class="clock">${hh}:${mm}</div>
    </div>
    <button class="closebtn" id="todayClose">✕</button>
  </div>`;

  const items=d.items;
  if(!items.length){
    h+=`<div class="card"><div class="nm">這天還沒安排行程</div>
      <div class="tm">回到清單模式加點東西吧</div></div>`;
    el.innerHTML=h;el.querySelector('#todayClose').onclick=closeToday;return;
  }

  const cur=items.find(c=>nm>=c.s&&nm<c.e);
  const nextIdx=items.findIndex(c=>c.s>nm);
  const next=nextIdx>=0?items[nextIdx]:null;

  if(cur){
    h+=`<div class="card now"><div class="lbl">現在</div>
      <div class="nm">${cur.emoji||CAT[cur.cat].e} ${esc(cur.name)}</div>
      <div class="tm">${fmt(cur.s)} – ${fmt(cur.e)}</div>
      <div class="big">還有 ${cur.e-nm} 分鐘 ・ ${fmt(cur.e)} 要走</div></div>`;
  }else if(next){
    const from=nextIdx===0?(d.fromL||null):items[nextIdx-1];
    h+=`<div class="card now"><div class="lbl">${nextIdx===0?'今天還沒開始':'移動中'}</div>
      <div class="nm">前往 ${esc(next.name)}</div>
      <div class="big">${next.s>nm?`${next.s-nm} 分鐘後開始（${fmt(next.s)}）`:'已經該到了'}</div>
      ${from?`<div class="tm">從 ${esc(from.name)} 出發</div>`:''}</div>`;
  }else{
    const last=items[items.length-1];
    h+=`<div class="card now"><div class="lbl">今天的行程結束了</div>
      <div class="nm">${d.toL?'🏨 '+esc(d.toL.name):'收工'}</div>
      <div class="tm">最後一項 ${esc(last.name)} 於 ${fmt(last.e)} 結束</div></div>`;
  }

  /* 下一段怎麼去 */
  if(next){
    const tr=next.tr||(nextIdx===0?d.trIn:null);
    const from=nextIdx===0?d.fromL:items[nextIdx-1];
    const M=tr?MODES[tr.mode]:null;
    h+=`<div class="move">
      <div class="txt">${M?`${M.i} ${M.n}${tr.min!=null?` 約 ${tr.min} 分`:''}`:'交通未設定'}</div>
      ${next.lat!=null?`<a href="${dirLink(from,next,tr?tr.mode:'transit')}" target="_blank">導航</a>`:''}
    </div>
    <div class="card"><div class="lbl">接下來</div>
      <div class="nm">${next.emoji||CAT[next.cat].e} ${esc(next.name)}</div>
      <div class="tm">${fmt(next.s)} – ${fmt(next.e)} ・ 停留 ${durTxt(next.dur)}
        ${next.pin?` ・ 📌 ${next.pin}`:''}</div>
      ${next.note?`<div class="tm">📝 ${esc(next.note)}</div>`:''}</div>`;
  }else if(d.toL&&d.homeAt!=null){
    h+=`<div class="move"><div class="txt">🏨 回 ${esc(d.toL.name)}</div>
      ${d.toL.lat!=null?`<a href="${dirLink(items[items.length-1],d.toL,d.trOut?d.trOut.mode:'transit')}" target="_blank">導航</a>`:''}</div>`;
  }

  /* 今天剩下的 */
  const rest=items.filter(c=>c.s>nm).slice(next?1:0);
  if(rest.length){
    h+=`<div class="rest">今天剩下 ${rest.length} 項<br>`+
      rest.map(c=>`${fmt(c.s)} <b>${esc(c.name)}</b>`).join('<br>')+
      (d.homeAt!=null?`<br>${fmt(d.homeAt)} 回到住宿`:'')+`</div>`;
  }else if(d.homeAt!=null&&nm<d.homeAt){
    h+=`<div class="rest">${fmt(d.homeAt)} 回到住宿</div>`;
  }

  el.innerHTML=h;
  el.querySelector('#todayClose').onclick=closeToday;
}
function openToday(){
  $('#today').classList.add('on');renderToday();
  clearInterval(todayTimer);todayTimer=setInterval(renderToday,30000);
}
function closeToday(){
  $('#today').classList.remove('on');clearInterval(todayTimer);todayTimer=null;
}

/* ══════════════════ 多趟旅行（左側抽屜） ══════════════════ */
const md=s=>s?s.slice(5).replace('-','/'):'';
function renderTrips(){
  $('#tripList').innerHTML=DB.trips.map(t=>{
    const items=t.days.reduce((a,d)=>a+d.items.length,0);
    return `<div class="trow ${t.id===DB.currentId?'on':''}">
      <div class="g" data-trip="${t.id}"><b>${esc(t.trip.title||'未命名旅程')}</b>
        <small>${t.sync?'👥 ':''}${md(t.trip.startDate)} – ${md(t.trip.endDate)} ・ ${t.days.length} 天 ・ ${items} 個行程</small></div>
      <button data-dup="${t.id}" title="複製">⧉</button>
      <button data-deltrip="${t.id}" title="刪除">🗑</button>
    </div>`;
  }).join('');
}

$('#drawer').onclick=e=>{if(e.target.id==='drawer')closeDrawer()};

function switchTrip(id){
  DB.currentId=id;S=curTrip();day=0;poolQ='';poolCat='all';poolSort='order';poolUse='todo';
  if(viewMode!=='list'){viewMode='list';applyView()}   // 切回清單，避免畫面停在舊旅程
  $('#poolQ').value='';$('#sheet').classList.remove('open');
  syncDayCount();closeDrawer();render();
}
function dupTrip(id){
  const t=DB.trips.find(x=>x.id===id);
  const c=JSON.parse(JSON.stringify(t));
  c.id=nid();c.trip.title=(t.trip.title||'行程')+'（副本）';
  c.days.forEach(d=>{d.id=nid();d.trIn=null;d.trOut=null;
    d.items.forEach(a=>{a.id=nid();a.tr=null;a.open=false})});
  c.pool.forEach(a=>{a.id=nid();a.open=false});
  (c.lodgings||[]).forEach(l=>l.id=nid());
  DB.trips.push(c);save();renderTrips();toast('已複製一份');
}
function delTrip(id){
  if(DB.trips.length<=1)return toast('至少要保留一趟旅程');
  const t=DB.trips.find(x=>x.id===id);
  openModal(`<h3>刪除「${esc(t.trip.title||'未命名旅程')}」？</h3>
    <p class="hint">整趟旅程、候選池與住宿都會消失，無法復原。建議先匯出備份。</p>
    <button class="mbtn dgr" id="yes">確定刪除</button>
    <button class="mbtn gh" id="no">取消</button>`);
  $('#no').onclick=closeModal;
  $('#yes').onclick=()=>{
    snapshot('刪除旅程「'+(t.trip.title||'未命名')+'」');
    DB.trips=DB.trips.filter(x=>x.id!==id);
    if(DB.currentId===id)DB.currentId=DB.trips[0].id;
    S=curTrip();day=0;closeModal();syncDayCount();renderTrips();render();toast('已刪除旅程',true);
  };
}
$('#newTrip').onclick=()=>{
  const today=iso(new Date(S.trip.startDate+'T00:00:00'));
  openModal(`<h3>新增旅程</h3>
    <label class="f">名稱</label><input id="n_title" placeholder="例：京都賞楓">
    <div class="two">
      <div><label class="f">出發日期</label><input type="date" id="n_from" value="${today}"></div>

    <label class="f">主要地區（搜尋範圍，選填）</label><input id="n_area" placeholder="例：京都">
    <button class="mbtn" id="ok">建立</button>`);
  $('#ok').onclick=()=>{
    const t=blankTrip($('#n_title').value.trim()||'新的旅程',

    DB.trips.push(t);DB.currentId=t.id;S=t;day=0;
    closeModal();switchTrip(t.id);toast('已建立旅程');
  };
};

window.addEventListener('beforeunload',()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}});

/* 註冊 Service Worker：讓 App 在沒網路時也打得開（出國必備） */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
